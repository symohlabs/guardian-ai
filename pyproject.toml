[project]
name = "guardian-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]==0.162.0",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pandas-stubs~=3.1.0",
    "pathlib>=1.0.1",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "slowapi>=0.1.10",
